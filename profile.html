<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-page">

    <nav class="navbar">
        <div class="logo">CampusConnect</div>
        <div class="user-actions">
            <span class="user-profile">user</span>
        </div>
    </nav>

    <main class="profile-container card">
        <div class="profile-header">
            <h1 id="profile-name">Loading...</h1>
            <p id="profile-email-header">student@university.edu</p>
        </div>
        <div class="profile-info">
            <p><strong>University ID:</strong> <span id="profile-id"></span></p>
            <p><strong>Contact Email:</strong> <span id="profile-email"></span></p>
        </div>
        
        <section class="profile-activity">
            <h2>Offers Received on My Requests</h2>
            <div id="offers-received-list" class="activity-list">
            </div>
        </section>

        <div class="form-actions">
            <a href="home.html" class="cancel-btn">Back to Dashboard</a>
        </div>
    </main>
    
    <script src="js/app.js"></script>
</body>
</html>
