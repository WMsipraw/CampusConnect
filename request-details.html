<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="request-details-page">

    <main class="request-details-card card">
        <h1 id="details-title">Loading Details...</h1>
        <p id="details-desc">Full request details will appear here...</p>
        
        <div class="request-meta">
            <p><strong>Category:</strong> <span id="details-category"></span></p>
            <p><strong>Budget:</strong> <span id="details-budget"></span></p>
            <p><strong>Deadline:</strong> <span id="details-deadline"></span></p>
            <p><strong>Client:</strong> <span id="details-client"></span></p>
        </div>

        <section class="offer-form-section">
            <h2>Send an Offer to Help</h2>
            <form id="offer-form" class="fields">
                <label for="offer-message">Your Proposal Message</label>
                <textarea id="offer-message" required placeholder="Tell the client how you can help (e.g., 'I can fix your laptop formatting tomorrow evening!')."></textarea>
                
                <button type="submit" class="submit-btn">Send Offer to Client</button>
                <a href="home.html" class="cancel-btn">Back to Dashboard</a>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
